version: "3.1"
services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
      POSTGRES_DB: electricity
    build:
      context: ./database
      dockerfile: Dockerfile
    ports:
      - 5432:5432
  adminer:
    image: adminer
    restart: always
    ports:
      - 8088:8080
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 5152:8080
    environment:
      ConnectionStrings__DbConnection: "Host=db;Port=5432;Database=electricity;Username=academy;Password=academy"
    depends_on:
      - db
